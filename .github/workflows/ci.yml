name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    name: Web, Embed & Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build CSS (strict)
        run: |
          npm run clean
          set +e
          out=$(npm run build:css -- --strict 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s\n' "$out" | tail -n 80)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            printf '::error title=Build CSS failed::%s\n' "$msg"
            exit $code
          fi
      - name: Build Stencil targets (www, dist, custom elements)
        run: |
          set +e
          out=$(npm run build:web 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s\n' "$out" | tail -n 80)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            printf '::error title=Build Stencil failed::%s\n' "$msg"
            exit $code
          fi
      - name: Verify build outputs
        run: |
          test -s dist/css/minimal.css
          test -s dist/css/app.css
          test -s www/build/mplay3r.esm.js
          test -s www/embed-demo.html
          test -s www/manifest.webmanifest
          test -s www/icons/icon.svg
          test -s www/sw.js
          test -s dist/components/index.js
          test -s dist/components/mplay3r-app.js
          test -s loader/index.js
      - name: Check bundle weight budget
        run: |
          set +e
          out=$(npm run check:size 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s\n' "$out" | tail -n 80)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            printf '::error title=Bundle weight budget failed::%s\n' "$msg"
            exit $code
          fi
      - name: Check release readiness & GitHub Pages subpath safety
        run: |
          set +e
          out=$(npm run check:release 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s\n' "$out" | tail -n 80)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            printf '::error title=Release readiness check failed::%s\n' "$msg"
            exit $code
          fi
      - name: Typecheck
        run: |
          set +e
          out=$(npm run typecheck 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s\n' "$out" | tail -n 80)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            printf '::error title=Typecheck failed::%s\n' "$msg"
            exit $code
          fi
      - name: Lint TypeScript
        run: |
          set +e
          out=$(npm run lint 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s\n' "$out" | tail -n 80)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            printf '::error title=Lint TypeScript failed::%s\n' "$msg"
            exit $code
          fi
      - name: Lint SCSS
        run: |
          set +e
          out=$(npm run lint:css 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s\n' "$out" | tail -n 80)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            printf '::error title=Lint SCSS failed::%s\n' "$msg"
            exit $code
          fi
      - name: Run unit tests
        run: |
          set +e
          out=$(npm test 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s\n' "$out" | tail -n 80)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            printf '::error title=Unit tests failed::%s\n' "$msg"
            exit $code
          fi

  desktop:
    name: Desktop Tauri v2 (Rust Check & Tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri v2 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Prepare minimal frontendDist placeholder for Tauri compile check
        run: |
          mkdir -p www
          printf '<!doctype html><title>mPlay3r</title>\n' > www/index.html
      - name: Run Rust unit tests (portable, HTTP Range streaming, allowlist)
        run: |
          set +e
          out=$(cargo test --manifest-path src-tauri/Cargo.toml 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s\n' "$out" | tail -n 80)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            printf '::error title=Rust cargo test failed::%s\n' "$msg"
            exit $code
          fi
      - name: Verify Rust release-ready targets compile cleanly
        run: |
          set +e
          out=$(cargo check --manifest-path src-tauri/Cargo.toml --all-targets 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s\n' "$out" | tail -n 80)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            printf '::error title=Rust cargo check failed::%s\n' "$msg"
            exit $code
          fi
