name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install & build frontend
        run: |
          npm install
          npm run build
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'mPlay3r ${{ github.ref_name }}'
          releaseBody: 'Portable, installable, and web builds of mPlay3r.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Package Windows standalone portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable-stage | Out-Null
          Copy-Item src-tauri/target/release/mplay3r.exe portable-stage/mPlay3r.exe
          New-Item -ItemType File -Force -Path portable-stage/portable.flag | Out-Null
          Compress-Archive -Path portable-stage/* -DestinationPath mPlay3r-windows-portable.zip
      - name: Upload portable zip artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mPlay3r-windows-portable
          path: mPlay3r-windows-portable.zip
